name: Release

# labelvier release finish tags without a v prefix; the v form stays supported
# for tags set by hand.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against package.json
        run: |
          version="$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[^"]*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json." >&2
            exit 1
          fi

      - name: Build the release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          {
            scripts/changelog-section.sh "$tag"
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | bash -s -- ${GITHUB_REF_NAME}"
            echo '```'
            echo ""
            echo "Without the version argument the install follows \`master\`, so the newest release."
          } > release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
