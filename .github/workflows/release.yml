name: Release

# labelvier release finish tagt zonder v-prefix; de v-vorm blijft erbij voor
# tags die met de hand zijn gezet.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Release publiceren
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Controleer of de tag bij package.json hoort
        run: |
          version="$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[^"]*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME hoort niet bij versie $version in package.json." >&2
            exit 1
          fi

      - name: Release-notes uit de changelog halen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          {
            scripts/changelog-section.sh "$tag"
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | bash -s -- ${GITHUB_REF_NAME}"
            echo '```'
            echo ""
            echo "Zonder het versieargument volgt de installatie gewoon \`master\`, dus de nieuwste release."
          } > release-notes.md

      - name: Release aanmaken of bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
