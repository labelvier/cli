name: Test

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  test:
    name: bats + node:test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install bats
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Install GNU parallel (bats --jobs)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install parallel; else sudo apt-get install -y parallel; fi
          mkdir -p ~/.parallel && touch ~/.parallel/will-cite

      - name: Syntax
        run: tests/run.sh syntax

      - name: Bats
        run: tests/run.sh bats

      - name: Node
        run: tests/run.sh node
